steps:
- id: B1
  t_start: 0.0
  t_end: 8.0
  narration: Không khí hít vào đi qua cây phế quản tới hàng triệu phế nang bao quanh
    bởi mạng lưới mao mạch phổi.
  visual: Toàn cảnh phổi (bioicons-healthy-lung.svg) kết hợp ảnh thu nhỏ mạng mao mạch
    phổi trên nền >= 60% khung; MagnifierZoom từ vùng nhu mô phổi ngoại vi mở sang chùm
    phế nang (niaid-alveoli-14.svg) giữ sạch 60f trước nhãn "Chùm phế nang".
  claim: Trao đổi khí diễn ra tại phổi giữa không khí trong phế nang và máu trong
    mạng mao mạch phổi sát bên dưới biểu mô phế nang.
  quotes:
  - source_id: powers2023
    quote: Gas exchange occurs in the lungs between alveolar air and the blood of
      the pulmonary capillaries.
    locator: Abstract
  - source_id: makanya2013
    quote: Subsequent diminution of interstitial tissue and apposition of capillaries
      to the alveolar epithelium establish a thin BGB.
    locator: Abstract
- id: B2
  t_start: 8.0
  t_end: 16.0
  narration: Qua màng phế nang mao mạch mỏng, khí oxy đi vào máu còn khí cacbonic thoát
    ngược ra phế nang.
  visual: MagnifierZoom thứ hai mở từ thành phế nang sang mặt cắt màng phế nang –
    mao mạch gồm biểu mô phế nang (reactome-alveolus-R-ICO-014769.svg), khoảng kẽ mỏng
    và nội mô mao mạch (reactome-endothelial-R-ICO-014492.svg), mũi tên khuếch tán
    O₂ xuống máu và CO₂ ngược lên phế nang.
  claim: Phần mỏng của hàng rào máu – khí dày khoảng 0.2–0.3 µm, tạo chênh lệch phân
    áp giúp khuếch tán thụ động O₂ vào máu và loại bỏ CO₂ khỏi mao mạch phế nang.
  quotes:
  - source_id: makanya2013
    quote: In humans, the thin side has a thickness of 0.2-0.3 μm and covers approximately
      half of the alveolar wall [16].
    locator: 2. Structure of the Blood-Gas Barrier in Vertebrates
  - source_id: petersson2023
    quote: This maintains alveolar partial pressures that promote passive diffusion
      to add oxygen and remove carbon dioxide from blood in alveolar capillaries.
    locator: Abstract
- id: B3
  t_start: 16.0
  t_end: 24.0
  narration: Trong mao mạch phổi, dòng hồng cầu nhận phân tử oxy để gắn lên hemoglobin
    rồi thải cacbonic ra ngoài.
  visual: Dòng hồng cầu (bioicons-erythrocyte.svg) di chuyển trong lòng mao mạch,
    nhận hạt O₂ phát sáng viền teal (HbO₂) đồng thời giải phóng hạt CO₂ đi qua màng
    lên phế nang theo nhịp thở ra.
  claim: Oxy được vận chuyển chủ yếu nhờ gắn với phân tử hemoglobin trong hồng cầu,
    trong khi khí cacbonic được vận chuyển về phổi để thở ra môi trường ngoài.
  quotes:
  - source_id: patel2023
    quote: Oxygen is carried throughout the body primarily by a protein molecule,
      hemoglobin, in red blood cells.
    locator: Abstract
  - source_id: doyle2023
    quote: needs to be removed using transport to the lungs and subsequent expiration
      out into the surrounding environment.
    locator: Abstract
- id: B4
  t_start: 24.0
  t_end: 32.0
  narration: Khi phổi bị phù nề, dịch ứ ở khoảng kẽ làm rào trao đổi dày lên, khiến
    oxy khó vào máu.
  visual: Hình phù mao mạch (bioicons-edema-capillaries.svg) đặt cạnh mặt cắt rào khuếch
    tán có lớp dịch kẽ dày lên rõ rệt đẩy nội mô xuống dưới, làm phân tử O₂ chậm lại
    trong lớp dịch; mascot góc dưới nhắc lưu ý cơ chế.
  claim: Tăng áp lực thủy tĩnh mao mạch phổi gây phù nề phá vỡ tính toàn vẹn hàng rào
    phế nang – mao mạch và làm suy giảm độ dẫn khuếch tán khí.
  quotes:
  - source_id: tetaj2026
    quote: elevated left-sided filling pressures that increase pulmonary capillary hydrostatic
      pressure, disrupt alveolo-capillary barrier integrity, and impair gas exchange.
    locator: Abstract
  - source_id: fermoyle2021
    quote: Lung diffusing capacity is lower at rest and during exercise in HFpEF due
      to impaired gas conductance across the alveolar-capillary membrane.
    locator: Abstract
