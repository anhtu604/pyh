schema_version: '1.0'
id: alveolar-gas-exchange
title: Trao đổi khí O₂ và CO₂ qua màng phế nang – mao mạch
category: physiology
summary: Minh họa dòng khí hít vào đi qua cây phế quản đến chùm phế nang, sự khuếch
  tán thụ động O₂ vào máu gắn hemoglobin trên hồng cầu và thải CO₂ ra ngoài qua màng
  phế nang – mao mạch mỏng, đồng thời mô tả phù kẽ làm dày rào khuếch tán và cản trở
  trao đổi khí.
target_duration_seconds: 35
