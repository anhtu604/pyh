schema_version: '1.0'
id: atherosclerotic-plaque-rupture
title: Tích tụ LDL dưới nội mô, mảng xơ vữa và huyết khối khi nứt vỡ bao xơ
category: pathology
summary: Minh họa quá trình hình thành và biến chứng của mảng xơ vữa động mạch vành
  từ thấm giữ và oxy hóa hạt LDL dưới lớp nội mô tổn thương, thu hút bạch cầu đơn
  nhân tạo tế bào bọt, tụ lõi hoại tử dưới bao xơ collagen do tế bào cơ trơn tổng hợp,
  đến nứt vỡ bao xơ gây kết tập tiểu cầu và fibrin tạo huyết khối bít lòng mạch.
target_duration_seconds: 35
compositions:
  landscape: MedAnimAtheroscleroticPlaqueRupture
  portrait: null
