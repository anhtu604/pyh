steps:
- id: B1
  t_start: 0.0
  t_end: 8.0
  narration: Khi lớp nội mô động mạch vành suy yếu, nhiều hạt LDL thấm xuống dưới
    và bị oxy hóa.
  visual: Tim và hệ động mạch vành (niaid-heart-228.svg) kèm lát cắt các lớp thành
    động mạch (bioicons-vascular-tunic-artery.svg); MagnifierZoom từ động mạch vành
    mở sang mặt cắt lớp áo trong với nội mô (reactome-endothelial-R-ICO-014492.svg),
    LDL (bioicons-ldl-1.svg) thấm xuống chuyển thành oxLDL (bioicons-lipid-ldl-1.svg)
    sau 60f giữ hình.
  claim: Xơ vữa động mạch khởi phát khi rối loạn chức năng nội mô đi kèm thấm giữ
    và oxy hóa các hạt lipoprotein tỷ trọng thấp (LDL) trong lớp áo trong.
  quotes:
  - source_id: jebari2022
    quote: Atherosclerosis initiates upon endothelial dysfunction accompanied by low-density
      lipoprotein (LDL) retention and its modification in the intima [17,18].
    locator: 3. Atherosclerosis Initiation and Fatty Streak Formation
  - source_id: henein2022
    quote: Within the arterial wall, low-density lipoprotein cholesterol undergoes
      an oxidation.
    locator: Abstract
- id: B2
  t_start: 8.0
  t_end: 16.0
  narration: Bạch cầu đơn nhân xuyên qua thành mạch, nuốt LDL oxy hóa và biến thành
    tế bào bọt.
  visual: Mặt cắt thành mạch mở rộng >= 60% khung cho thấy bạch cầu đơn nhân (bioicons-monocyte.svg)
    xuyên khe nội mô vào lớp áo trong, thu nhận hạt oxLDL và biệt hóa thành các tế
    bào bọt giàu lipid (bioicons-foam-cell-1.svg).
  claim: Bạch cầu đơn nhân xâm nhập lớp áo trong biệt hóa thành đại thực bào, bắt giữ
    mạnh LDL biến đổi và hình thành tế bào bọt.
  quotes:
  - source_id: jebari2022
    quote: Once in the intima, monocytes are differentiated into macrophages that can
      be polarized to the M1 (pro-inflammatory) or M2 (anti-inflammatory) phenotype
      [141,142].
    locator: 3.4. Monocyte Recruitment and Foam Cell Formation
  - source_id: jebari2022
    quote: Modified LDLs are avidly captured by differentiated monocytes and VSMC,
      which promote foam cell formation [19,20].
    locator: 3. Atherosclerosis Initiation and Fatty Streak Formation
- id: B3
  t_start: 16.0
  t_end: 24.0
  narration: Tế bào bọt tụ thành lõi hoại tử giàu mỡ, phía trên được che bởi bao xơ
    sợi collagen.
  visual: Các tế bào bọt hợp nhất thành lõi hoại tử giàu lipid nâng vòm thành mạch
    lên phía lòng mạch; tế bào cơ trơn (bioicons-smooth-muscle-fiber.svg) di cư phủ
    lớp sợi collagen (bioicons-collagen-1.svg) tạo bao xơ bảo vệ phía trên.
  claim: Đại thực bào thoái hóa tụ thành lõi hoại tử giàu lipid được bao bọc bởi bao
    xơ sợi collagen có sự tham gia bảo vệ của tế bào cơ trơn biến đổi.
  quotes:
  - source_id: henein2022
    quote: Macrophages catabolize the oxidized lipoproteins and coalesce into a lipid-rich
      necrotic core, encapsulated by a collagen fibrous cap, leading to the formation
      of fibro-atheroma.
    locator: Abstract
  - source_id: wirka2019
    quote: In response to various stimuli, vascular smooth muscle cells (SMCs) can
      de-differentiate, proliferate and migrate in a process known as phenotypic modulation.
    locator: Abstract
- id: B4
  t_start: 24.0
  t_end: 32.0
  narration: Khi bao xơ mỏng nứt vỡ, tiểu cầu kết tập cùng sợi fibrin lập tức tạo cục
    huyết khối bít lòng mạch.
  visual: Vết nứt bao xơ và tách lớp nội mô được dựng bằng SVG <mask> mềm tự nhiên;
    lõi hoại tử phơi bày kích hoạt tiểu cầu (reactome-platelet-active-R-ICO-014907.svg
    và niaid-platelet-415.svg) kết tập cùng mạng fibrin (bioicons-fibrin-1.svg) và
    hồng cầu (niaid-red-blood-cell-442.svg) tạo cục huyết khối cản dòng máu kèm mascot
    góc.
  claim: Bao xơ mỏng dần trở nên dễ tổn thương; khi nứt vỡ, khoang dưới nội mô tiếp
    xúc trực tiếp với máu làm tiểu cầu nhanh chóng hoạt hóa, kết tập và khởi phát
    huyết khối.
  quotes:
  - source_id: henein2022
    quote: macrophages exert a catabolic effect on the fibrous cap, resulting in a
      thin-cap fibro-atheroma which makes the plaque vulnerable.
    locator: Abstract
  - source_id: jebari2022
    quote: When the plaque fissures or ruptures, the subendothelial space is exposed
      to blood, triggering a coagulation process to cover the wound [186,236].
    locator: 5.2. Plaque Rupture and Thrombus Formation
  - source_id: boren2020
    quote: Thrombosis evolves with a predominance of platelets that are rapidly activated
      and recruited from the blood to the growing thrombus.
    locator: Which plaque components favour a thrombotic reaction upon rupture?
