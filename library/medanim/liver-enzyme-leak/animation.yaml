    sổ (LSEC — không có màng đáy liên tục).

    '
  checked_evidence: 'Servier endothelium_01..07 và NIAID BioArt 55 là nội mô liên
    tục thường; DBCLS File:202104_Fenestrated_capillary.svg (CC BY 4.0) có bao màng
    đáy liên tục (không chuẩn mô học xoang gan); NIAID BioArt 565 (CC BY 4.0) có vẽ
    endothelial fenestration nhưng kèm chữ tiếng Anh và thanh thước 50 µm trên hình.

    '
  r2_handling: 'Dùng mạch máu vector sạch niaid-blood-vessel-55.svg (Public Domain)
    với nhãn chuẩn "Lòng xoang gan / Sinusoidal lumen", tuyệt đối không tự vẽ lỗ cửa
    sổ và bỏ ghi chú nội bộ (*) khỏi khung hình.

    '
  doctor_action_needed: Bác sĩ xem xét duyệt dùng tạm mạch sạch cho mục đích minh
    họa cơ chế hoặc cung cấp hình LSEC chuẩn.
