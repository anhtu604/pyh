steps:
- id: B1
  t_start: 0.0
  t_end: 8.0
  narration: Gan gồm nhiều tiểu thùy; giữa mỗi tiểu thùy là tĩnh mạch trung tâm, ở
    rìa là các khoảng cửa.
  visual: 'Lá gan vector SVG (niaid-liver-230.svg) hiển thị cân đối >= 60% vùng nội
    dung (không mờ bitmap). Khung định vị teal trên vùng nhu mô gan (>= 24f) -> đường
    dẫn -> kính lúp MagnifierZoom nền đặc #F7F4EC mở rộng sang tiểu thùy gan (servier-liver-lobule.png
    <= 1.0x, có thể kèm bối cảnh lục giác dbcls-hepatic-lobule.svg), hình gan gốc
    lùi mờ nhẹ phía sau qua magnifierOverviewOpacity (tuyệt đối không cross-fade chồng
    mờ 2 tỷ lệ). Giữ hình tiểu thùy >= 2s (60f) trước khi hiện nhãn "Tĩnh mạch trung
    tâm" và "Khoảng cửa". Mini-map Gan -> Tiểu thùy -> Tế bào dùng pill/badge nhấn,
    không gạch chân.'
  claim: Tiểu thùy gan cổ điển có dạng gần lục giác, tĩnh mạch trung tâm ở giữa; các
    góc là khoảng cửa (bộ ba cửa) gồm nhánh tĩnh mạch cửa, nhánh động mạch gan và
    ống mật.
  quotes:
  - source_id: kietzmann2017
    quote: Classically it is of almost hexagonal shape with a central vein in the
      middle.
    locator: Fig. 1A
  - source_id: vernon2022
    quote: At the vertices of the hexagon is a triad of a bile duct branch, a portal
      vein branch, and a hepatic artery branch
    locator: Abstract
- id: B2
  t_start: 8.0
  t_end: 16.0
  narration: Máu từ tĩnh mạch cửa và động mạch gan hòa vào nhau, chảy qua xoang gan
    về tĩnh mạch trung tâm.
  visual: Cảnh tiểu thùy và sơ đồ cơ chế chiếm >= 60% khung hình, cân đối không thừa
    khoảng trống trái; nhãn chỉ lần lượt "Tĩnh mạch cửa", "Động mạch gan", "Xoang
    gan". Vẽ đường dòng chảy teal từ CẢ HAI nhánh (nhánh tĩnh mạch cửa và nhánh động
    mạch gan tại khoảng cửa) hợp lưu hòa trộn vào nhau chảy dọc xoang gan về tĩnh
    mạch trung tâm, cùng hồng cầu vector (niaid-red-blood-cell-442.svg) trôi theo
    dòng; mũi tên mật navy đi xuống ống mật về khoảng cửa ngược chiều dòng máu kèm
    chú thích rõ ràng.
  claim: Máu từ nhánh tĩnh mạch cửa và nhánh động mạch gan ở khoảng cửa hòa trộn,
    chảy qua các xoang gan giữa các bè tế bào gan về tĩnh mạch trung tâm.
  quotes:
  - source_id: kietzmann2017
    quote: The blood coming from the branches of the portal vein and the hepatic artery
      in the portal tracts flows as a mixture through the sinusoids
    locator: Fig. 1A-B
  - source_id: vernon2022
    quote: Blood flows from the portal vein branch and hepatic artery branch across
      the lobule and finally into the central vein
    locator: Abstract
- id: B3
  t_start: 16.0
  t_end: 24.0
  narration: Trong tế bào gan, ALT chủ yếu nằm ở bào tương, còn AST có ở cả bào tương
    lẫn ty thể.
  visual: 'Khung định vị teal trên vùng bè tế bào tiểu thùy -> đường dẫn -> kính lúp
    MagnifierZoom nền đặc #F7F4EC mở rộng sang tế bào gan vector (niaid-hepatocyte-203.svg),
    các ty thể vector (niaid-mitochondria-352.svg) và lòng mạch máu vector sạch (niaid-blood-vessel-55.svg
    làm lòng xoang tạm thời với nhãn "Lòng xoang gan / Sinusoidal lumen" và hồng cầu
    vector); hình tiểu thùy phía sau lùi mờ qua magnifierOverviewOpacity. Giữ hình
    tế bào >= 2s (60f) trước nhãn "Bào tương" và "Ty thể". Không tự vẽ lỗ cửa sổ LSEC;
    bỏ sạch mọi ghi chú nội bộ (*) khỏi khung hình (xem open_issues).'
  claim: 'ALT có dạng bào tương (ALT1) và dạng ty thể (ALT2); ALT1 là dạng chiếm ưu
    thế trong gan, nên ALT được mô tả là chủ yếu ở bào tương tế bào gan. AST có hai
    isoenzyme: bào tương (c-AST) và ty thể (m-AST).'
  quotes:
  - source_id: mcgill2016
    quote: ALT1 is now known to be the dominant isoform of ALT in the liver (Lindblom
      et al., 2007).
    locator: Main text
  - source_id: moriles2024
    quote: ALT is aggregated primarily in the cytosol of hepatocytes, consists of
      496 amino acids, and has a half-life of approximately 47 hours.
    locator: Abstract
  - source_id: panteghini1990
    quote: exists in human tissues as two distinct isoenzymes, one located in the
      cytoplasm (c-AST), and the other in mitochondria (m-AST).
    locator: Abstract
- id: B4
  t_start: 24.0
  t_end: 36.0
  narration: Tổn thương nhẹ làm men bào tương thoát ra; tổn thương nặng, hoại tử có
    thể giải phóng thêm AST ty thể, như trong mô hình gan chuột thiếu máu.
  visual: 'Dùng SVG <mask> mềm tự nhiên (bỏ vết cắt clipPath hình chữ nhật thô) ở
    vùng vi nhung mao mặt xoang tại INJURY_RING cho giai đoạn nhẹ (740f: men bào tương
    ALT + c-AST thoát vào lòng xoang) và trên màng ty thể ở giai đoạn nặng/hoại tử
    (850f/880f: m-AST thoát thêm). Giữ gọn thẻ phạm vi "Minh họa cơ chế · mô hình
    gan chuột thiếu máu (Kamiike 1989)" không đè hình hoặc phụ đề.'
  claim: Tăng aminotransferase huyết thanh thường được cho là do tế bào tổn thương
    làm mất toàn vẹn màng bào tương, men thoát vào máu; mặt tế bào gan hướng về xoang
    gan. Đây là cơ chế phổ biến nhất, không phải duy nhất (còn tăng biểu hiện gen,
    macroenzyme...).
  quotes:
  - source_id: mcgill2016
    quote: It is generally thought that aminotransferase elevations are due to cell
      damage with plasma membrane disruption.
    locator: Main text
  - source_id: moriles2024
    quote: any process that leads to loss of hepatocyte membrane integrity or necrosis
      results in the release of ALT in high concentrations in the plasma.
    locator: Abstract
  - source_id: kamiike1989
    quote: mitochondrial enzymes are liberated into the blood only after appreciable
      disintegration of the cells, probably necrosis
    locator: Abstract
    scope: Ischemic rat liver, not a universal clinical severity rule.
- id: B5
  t_start: 36.0
  t_end: 44.0
  narration: Từ tĩnh mạch trung tâm, máu về tĩnh mạch gan rồi tĩnh mạch chủ dưới,
    nên xét nghiệm máu đo được men.
  visual: 'Đóng kính lúp mượt từ tế bào về lại tiểu thùy (MagnifierZoom close); chấm
    men theo hồng cầu trôi dọc xoang lên tĩnh mạch trung tâm (đường teal); bố cục
    tiểu thùy bên trái + chuỗi mũi tên teal dẫn từ tĩnh mạch trung tâm -> "Tĩnh mạch
    gan" -> "Tĩnh mạch chủ dưới" -> "Xét nghiệm máu: ALT, AST" kết thúc bằng ống máu
    vector SVG (niaid-blood-vial-52.svg), phủ >= 60% khung hình cân đối.'
  claim: Tĩnh mạch trung tâm là nhánh của tĩnh mạch gan; tĩnh mạch gan đổ vào tĩnh
    mạch chủ dưới. Xét nghiệm đánh giá tổn thương gan bằng cách đo hoạt độ trong huyết
    tương của các men vốn nằm trong tế bào gan.
  quotes:
  - source_id: turamanlar2012
    quote: The hepatic and renal veins drain into the inferior vena cava.
    locator: Abstract
  - source_id: moriles2024
    quote: Most commonly, this is accomplished by measuring the plasma activities
      of enzymes found within liver cells
    locator: Abstract
- id: B6
  t_start: 44.0
  t_end: 50.0
  narration: AST còn có nhiều ở cơ vân và cơ tim, nên AST tăng không chỉ do gan.
  visual: 'Khung chốt chuyển mượt sang ba biểu tượng cơ quan vector SVG đặt cân đối
    (>= 60% khung): Gan (niaid-liver-230.svg), Cơ vân (reactome-muscle-R-ICO-014108.svg),
    Cơ tim (niaid-heart-228.svg); hạt AST xuất phát từ cả ba cơ quan, ALT nhấn ở gan.
    Mascot góc (myth_bust -> thumbs_up), thẻ cuối ghi đầy đủ credit nguồn hình (NIAID
    NIH BioArt, Servier Medical Art, Reactome, DBCLS nếu hiển thị) và 7 nguồn y văn.
    Phụ đề tĩnh theo trang không gạch chân.'
  claim: Cơ vân, cơ tim và gan là các nguồn chính của AST, nên AST không đặc hiệu
    cho gan. ALT chủ yếu ở gan nhưng cũng có ở thận, tim, cơ; ALT tăng nhạy nhưng
    không đặc hiệu cho nguyên nhân.
  quotes:
  - source_id: panteghini1990
    quote: Striated muscle, myocardium, and liver tissues are the main sources of
      AST.
    locator: Abstract
  - source_id: moriles2024
    quote: Alanine aminotransferase (ALT) is an enzyme found predominantly in the
      liver but also in other tissues such as the kidneys, heart, and muscle cells.
    locator: Abstract
