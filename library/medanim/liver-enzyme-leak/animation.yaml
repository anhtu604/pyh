schema_version: '1.0'
id: liver-enzyme-leak
title: Tế bào gan tổn thương → ALT/AST vào máu
category: pathophysiology
summary: Minh họa cơ chế tổn thương màng tế bào gan và ty thể làm giải phóng ALT,
  c-AST và m-AST qua lòng xoang vào tĩnh mạch trung tâm, dẫn lưu về tuần hoàn chung,
  đồng thời phân biệt nguồn AST ngoài gan ở cơ vân và cơ tim.
target_duration_seconds: 53
compositions:
  landscape: MedAnimLiverEnzymeLeak
  portrait: MedAnimLiverEnzymeLeakVertical
