  summary: 'Hình khối tiểu thùy servier-liver-lobule.png không có nhãn gốc; nhận diện
    ống xanh lá = ống mật, ống xanh dương đáy = nhánh TM cửa, ống đỏ = nhánh ĐM gan,
    trụ xanh dương đỉnh = TM trung tâm dựa trên Kietzmann 2017 Fig. 1A. Đã bổ sung
    dbcls-hepatic-lobule.svg (lục giác cổ điển, CC BY 4.0).

    '
  doctor_action_needed: Bác sĩ xác nhận định danh mạch, hợp lưu ĐM gan + TM cửa và
    chiều dòng mật trên khối 3D.
- id: space-of-disse-and-alt2-simplification
  severity: doctor_confirmation
  category: mechanism_simplification
  steps:
  - B3
  - B4
