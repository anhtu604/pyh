  doi: 10.3389/fimmu.2020.01066
  citation: Uribe-Querol E, Rosales C. Phagocytosis Our Current Understanding of a
    Universal Biological Process. Front Immunol. 2020;11:1066.
  checked_in: full_text
  url: https://europepmc.org/article/PMC/PMC7280488
- id: vieira2002
  pmid: '12061891'
  pmcid: PMC1222826
  doi: 10.1042/bj20020691
  citation: Vieira OV, Botelho RJ, Grinstein S. Phagosome maturation aging gracefully.
    Biochem J. 2002;366(Pt 3):689-704.
  checked_in: abstract
  url: https://europepmc.org/article/PMC/PMC1222826
steps:
- id: B1
  t_start: 0.0
  t_end: 8.0
  narration: Đại thực bào tuần tra mô, dùng thụ thể nhận diện khuôn mẫu gắn lên phân
    tử bề mặt vi khuẩn.
  visual: Toàn cảnh đại thực bào (niaid-macrophage-308.svg) tiếp cận vi khuẩn (bioicons-generic-bacterium.svg)
    trên nền >= 60% khung; MagnifierZoom từ vùng tiếp xúc màng mở sang chi tiết thụ
    thể PRR gắn phân tử PAMP và giữ sạch 60f trước khi hiện nhãn.
  claim: Các thụ thể nhận diện khuôn mẫu (PRR) nhận diện trực tiếp các mẫu phân tử
    gắn mầm bệnh (PAMP) trên bề mặt vi khuẩn để khởi phát thực bào.
  quotes:
  - source_id: uribe2020
    quote: Receptors directly recognizing pathogen-associated molecular patterns (PAMPs)
      are the pattern-recognition receptors (PRRs).
    locator: Detection of the Target Particle
- id: B2
  t_start: 8.0
  t_end: 16.0
  narration: Màng tế bào vươn chân giả bao bọc vi khuẩn rồi khép kín, tạo thành túi
    thực bào bên trong.
  visual: Cảnh song song trong đại thực bào cho thấy chân giả actin (bioicons-engulfing-membrane.svg
    kèm sợi F-actin teal) ôm bắt vi khuẩn, rồi khép kín thành túi thực bào (bioicons-phagocytosis-2d.svg)
    với nhãn xuất hiện tuần tự từng thẻ.
  claim: Quá trình trùng hợp sợi F-actin tạo chân giả vươn ôm kín mục tiêu để hình
    thành không bào bắt nguồn từ màng sinh chất gọi là túi thực bào.
  quotes:
  - source_id: uribe2020
    quote: Then, pseudopods are formed around the particle until the membrane completely
      covers the particle to form a new phagosome inside the cell.
    locator: Activation of the Internalization Process
  - source_id: vieira2002
    quote: The initial stage of the elimination process is the internalization of the
      particles into a plasma membrane-derived vacuole known as the phagosome.
    locator: Abstract
- id: B3
  t_start: 16.0
  t_end: 24.0
  narration: Túi thực bào trưởng thành hợp nhất với lysosome, bơm proton axit hóa lòng
    túi tạo phagolysosome.
  visual: MagnifierZoom thứ hai từ túi thực bào mở sang cận cảnh túi thực bào (bioicons-vacuole-blue.svg)
    hợp nhất nhiều lysosome (reactome-lysosome-R-ICO-012966.svg), thể hiện chú giải
    bơm V-ATPase và enzym thủy phân sau 60f giữ hình.
  claim: Ở giai đoạn cuối của quá trình trưởng thành, túi thực bào hợp nhất với lysosome
    thành phagolysosome có môi trường rất axit (pH xuống tới 4.5) nhờ tích tụ bơm V-ATPase.
  quotes:
  - source_id: uribe2020
    quote: At the last stage of phagosome maturation, phagosomes fuse with lysosomes
      to become phagolysosomes (3).
    locator: Phagolysosome
  - source_id: uribe2020
    quote: First, phagolysosomes are very acidic (pH as low as 4.5) due to the accumulation
      of many V-ATPase molecules on their membrane (136).
    locator: Phagolysosome
- id: B4
  t_start: 24.0
  t_end: 32.0
  narration: Gốc oxy hóa mạnh và enzym thủy phân tiêu hủy vi khuẩn an toàn, không làm
    vỡ màng tế bào.
  visual: Trong lòng phagolysosome kín, vi khuẩn phân giải mềm qua SVG <mask> dưới
    tác động của hạt ROS và enzym thủy phân; bên phải đặt thẻ chu trình thực bào (bioicons-phagocytosis.svg)
    cho thấy đại thực bào sống sót nguyên vẹn cùng mascot góc.
  claim: Phagolysosome mang phức hợp NADPH oxidase tạo gốc oxy hóa (ROS) và nhiều enzym
    thủy phân (cathepsin, protease, lysozyme, lipase) để phân hủy vi khuẩn bị nuốt
    vào.
  quotes:
  - source_id: uribe2020
    quote: The phagolysosome membrane also presents the NADPH oxidase complex, that
      is responsible for producing reactive oxygen species (ROS), such as superoxide
      (O2−) (137, 138).
    locator: Phagolysosome
  - source_id: uribe2020
    quote: In addition, the phagolysosome contains several hydrolytic enzymes, such
      as cathepsins, proteases, lysozymes, and lipases, which contribute to degrade
      ingested microorganisms (135) (Figure 6).
    locator: Phagolysosome
