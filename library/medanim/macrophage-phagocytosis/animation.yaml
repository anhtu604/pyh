schema_version: '1.0'
id: macrophage-phagocytosis
title: Đại thực bào nhận diện, nuốt vi khuẩn và hợp nhất phagolysosome
category: microbiology
summary: Minh họa đại thực bào dùng thụ thể PRR nhận diện PAMP bề mặt vi khuẩn, vươn
  chân giả actin ôm gọn tạo túi thực bào, hợp nhất với lysosome axit hóa nhờ bơm V-ATPase
  và tiêu hủy vi khuẩn bên trong bằng ROS và enzym thủy phân mà vẫn giữ nguyên vẹn
  màng tế bào.
target_duration_seconds: 35
compositions:
  landscape: MedAnimMacrophagePhagocytosis
  portrait: null
sources:
- id: uribe2020
  pmid: '32582172'
