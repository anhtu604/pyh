# Bậc model và bảng vai của xưởng (spec 2026-11-08 mục 5.1).
# Mỗi chuỗi được thử theo thứ tự; mục hết lượt thì "nghỉ" và chuyển sang mục kế tiếp.
# skills: tên thư mục trong .agents/skills/ (spec 5.3), tối đa 3.
# 2026-11-14 chuẩn hóa agent: gọi model trực tiếp cho nhiệm vụ hữu hạn.
# Mẫu thử và giới hạn đánh giá: docs/reference/agent-model-evaluation.md.
# Biên kịch Sol; y khoa Carbon high; kiểm duyệt/hình/dựng Carbon medium;
# việc nhẹ Hydrogen medium. Không dùng Opus, astra; không tự bật lại pilot.
tiers:
  hard:  # 2026-11-12 bác sĩ: dùng model vừa phải, không dùng Opus hay astra
    - {cli: agy, model: gemini-4-carbon-high}
    - {cli: codex, model: gpt-6.1-sol}
    - {cli: claude, model: claude-sonnet-5-5}
    - {cli: codex, model: gpt-6.1-terra}
  medium:  # nhiệm vụ có ranh rõ, không mặc định giao orchestrator
    - {cli: agy, model: gemini-4-carbon-medium}
    - {cli: codex, model: gpt-6.1-sol}
    - {cli: claude, model: claude-sonnet-5-5}
    - {cli: codex, model: gpt-6.1-terra}
  bulk:  # 2026-11-14 đo cùng việc nhẹ: Hydrogen medium 16s, Flash 18s, Orchestrator Argon 30s, Carbon 45s
    - {cli: agy, model: gemini-4-hydrogen-medium}
    - {cli: codex, model: gpt-6-luna}
    - {cli: claude, model: claude-haiku-5-5}
    - {cli: codex, model: gpt-6.1-terra}

roles:
  coordinator:  # 2026-11-12 bác sĩ: model nhẹ để trả lời nhanh; câu khó escalate lên vai dưới
    name: Điều phối viên
    skills: [pyh-coordinator]
    steps: [chat]
    tier: bulk
    models:  # 2026-11-14 bác sĩ: chat cần nhanh; Hydrogen nhanh nhất, Flash hay quá tải (503)
      - {cli: agy, model: gemini-4-hydrogen-medium}
      - {cli: agy, model: gemini-3.8-flash-medium}
      - {cli: codex, model: gpt-6-luna}
      - {cli: claude, model: claude-haiku-5-5}
  coordinator_senior:
    name: Điều phối viên chuyên sâu
    skills: [pyh-coordinator, pyh-coordinator-senior]
    steps: [chat_deep]
    tier: medium
    models:  # khác nhà cung cấp với Điều phối viên để vòng chuyên sâu thật sự khác
      - {cli: codex, model: gpt-6.1-sol}
      - {cli: claude, model: claude-sonnet-5-5}
      - {cli: agy, model: gemini-4-carbon-medium}
  scout:
    name: Trinh sát chủ đề
    skills: [content-strategy, pyh-scout]
    steps: [scout]
    tier: bulk
  medical_expert:  # spec 5.8: thay vai researcher
    name: Chuyên gia y học
    skills: [pyh-medical-expert]
    steps: [research]
    tier: hard
  writer:
    name: Biên kịch viral
    skills: [youtube-scriptwriting, short-form-video, pyh-writer]
    steps: [draft, revise_medical]
    tier: hard
    models:  # mẫu ngắn 2026-11-14: Sol 45s, Carbon medium 125s; chưa đo video dài
      - {cli: codex, model: gpt-6.1-sol}
      - {cli: agy, model: gemini-4-carbon-medium}
      - {cli: claude, model: claude-sonnet-5-5}
  script_critic:
    name: Kiểm duyệt kịch bản
    skills: [copy-editing, pyh-script-critic]
    steps: [script_review]
    tier: hard
    models:  # bắt đầu từ nhà cung cấp khác với biên kịch (biên kịch dùng codex)
      - {cli: agy, model: gemini-4-carbon-medium}
      - {cli: claude, model: claude-sonnet-5-5}
      - {cli: codex, model: gpt-6.1-sol}
  art_director:
    name: Đạo diễn hình
    skills: [pyh-art-director]
    steps: [visual_review]
    tier: medium
    models:  # phân công tạm thời; cần đánh giá bằng bộ ảnh trước sản xuất
      - {cli: agy, model: gemini-4-carbon-medium}
      - {cli: claude, model: claude-sonnet-5-5}
      - {cli: codex, model: gpt-6.1-sol}
      - {cli: codex, model: gpt-6.1-terra}
  editor:
    name: Thợ dựng
    skills: [remotion-best-practices, motion-design, pyh-editor]
    steps: [revise_production, revise_product]
    tier: medium
    models:  # phân công tạm thời; cần kiểm sửa component trước sản xuất
      - {cli: agy, model: gemini-4-carbon-medium}
      - {cli: claude, model: claude-sonnet-5-5}
      - {cli: codex, model: gpt-6.1-sol}
      - {cli: codex, model: gpt-6.1-terra}
  product_critic:
    name: Kiểm định sản phẩm
    skills: [character-animation-qa, pyh-product-critic]
    steps: [product_review]
    tier: hard
    models:  # khác Thợ dựng (agy) để không tự chấm bài mình
      - {cli: claude, model: claude-sonnet-5-5}
      - {cli: codex, model: gpt-6.1-sol}
      - {cli: agy, model: gemini-4-carbon-medium}
  copywriter:
    name: Viết bài đăng
    skills: [social, pyh-copywriter]
    steps: [posts]
    tier: bulk
  feedback_analyst:
    name: Phân tích ý kiến
    skills: [pyh-feedback-analyst]
    steps: [feedback_inbox]
    tier: bulk  # việc nhẹ, ưu tiên nhanh
