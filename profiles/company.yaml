# Bậc model và bảng vai của xưởng (spec 2026-11-08 mục 5.1).
# Mỗi chuỗi được thử theo thứ tự; mục hết lượt thì "nghỉ" và chuyển sang mục kế tiếp.
tiers:
  hard:  # agy trước: Claude và astra đang ít token (2026-11-08)
    - {cli: agy, model: claude-opus-5-5-high}
    - {cli: codex, model: gpt-6.1-sol}
    - {cli: claude, model: claude-opus-5-5}
    - {cli: codex, model: gpt-6-astra}
  medium:
    - {cli: claude, model: claude-sonnet-5-5}
    - {cli: codex, model: gpt-6.1-sol}
    - {cli: agy, model: gemini-4-argon-medium}
    - {cli: codex, model: gpt-6.1-terra}
  bulk:
    - {cli: claude, model: claude-haiku-5-5}
    - {cli: codex, model: gpt-6-luna}
    - {cli: agy, model: gemini-3.8-flash-medium}
    - {cli: codex, model: gpt-6.1-terra}

roles:
  coordinator:
    name: Điều phối viên
    skill: .agents/skills/pyh-coordinator/SKILL.md
    steps: [chat]
    tier: medium
  scout:
    name: Trinh sát chủ đề
    skill: .agents/skills/pyh-scout/SKILL.md
    steps: [scout]
    tier: bulk
  researcher:
    name: Nhà nghiên cứu
    skill: .agents/skills/pyh-researcher/SKILL.md
    steps: [research]
    tier: hard
  writer:
    name: Biên kịch
    skill: .agents/skills/pyh-writer/SKILL.md
    steps: [draft, revise_medical]
    tier: hard
  script_critic:
    name: Kiểm duyệt kịch bản
    skill: .agents/skills/pyh-script_critic/SKILL.md
    steps: [script_review]
    tier: hard
    models:  # bắt đầu từ nhà cung cấp khác với biên kịch
      - {cli: codex, model: gpt-6.1-sol}
      - {cli: agy, model: claude-opus-5-5-high}
      - {cli: claude, model: claude-opus-5-5}
      - {cli: codex, model: gpt-6-astra}
  art_director:
    name: Đạo diễn hình
    skill: .agents/skills/pyh-art_director/SKILL.md
    steps: [visual_review]
    tier: medium
    models:  # nhìn ảnh tốt
      - {cli: agy, model: gemini-4-argon-high}
      - {cli: claude, model: claude-sonnet-5-5}
      - {cli: codex, model: gpt-6.1-sol}
      - {cli: codex, model: gpt-6.1-terra}
  editor:
    name: Thợ dựng
    skill: .agents/skills/pyh-editor/SKILL.md
    steps: [revise_production, revise_product]
    tier: medium
    models:  # quen repo video
      - {cli: agy, model: gemini-4-argon-medium}
      - {cli: claude, model: claude-sonnet-5-5}
      - {cli: codex, model: gpt-6.1-sol}
      - {cli: codex, model: gpt-6.1-terra}
  product_critic:
    name: Kiểm định sản phẩm
    skill: .agents/skills/pyh-product_critic/SKILL.md
    steps: [product_review]
    tier: hard
  copywriter:
    name: Viết bài đăng
    skill: .agents/skills/pyh-copywriter/SKILL.md
    steps: [posts]
    tier: bulk
  feedback_analyst:
    name: Phân tích ý kiến
    skill: .agents/skills/pyh-feedback_analyst/SKILL.md
    steps: [feedback_inbox]
    tier: medium
