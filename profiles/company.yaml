# Bậc model và bảng vai của xưởng (spec 2026-11-08 mục 5.1).
# Mỗi chuỗi được thử theo thứ tự; mục hết lượt thì "nghỉ" và chuyển sang mục kế tiếp.
# skills: tên thư mục trong .agents/skills/ (spec 5.3), tối đa 3.
tiers:
  hard:  # agy trước: Claude và astra đang ít token (2026-11-08)
    - {cli: agy, model: claude-opus-5-5-high}
    - {cli: codex, model: gpt-6.1-sol}
    - {cli: claude, model: claude-opus-5-5}
    - {cli: codex, model: gpt-6-astra}
  medium:  # agy trước; Gemini 4 Carbon thay Argon từ 2026-11-11 (đã thử headless)
    - {cli: agy, model: gemini-4-carbon-medium}
    - {cli: codex, model: gpt-6.1-sol}
    - {cli: claude, model: claude-sonnet-5-5}
    - {cli: codex, model: gpt-6.1-terra}
  bulk:  # agy trước: Claude đang ít token (2026-11-08)
    - {cli: agy, model: gemini-3.8-flash-medium}
    - {cli: codex, model: gpt-6-luna}
    - {cli: claude, model: claude-haiku-5-5}
    - {cli: codex, model: gpt-6.1-terra}

roles:
  coordinator:
    name: Điều phối viên
    steps: [chat]
    tier: medium
  scout:
    name: Trinh sát chủ đề
    skills: [content-strategy]
    steps: [scout]
    tier: bulk
  medical_expert:  # spec 5.8: thay vai researcher
    name: Chuyên gia y học
    skills: [systematic-literature-review]
    steps: [research]
    tier: hard
  writer:
    name: Biên kịch viral
    skills: [youtube-scriptwriting, short-form-video]
    steps: [draft, revise_medical]
    tier: hard
  script_critic:
    name: Kiểm duyệt kịch bản
    skills: [copy-editing]
    steps: [script_review]
    tier: hard
    models:  # bắt đầu từ nhà cung cấp khác với biên kịch
      - {cli: codex, model: gpt-6.1-sol}
      - {cli: agy, model: claude-opus-5-5-high}
      - {cli: claude, model: claude-opus-5-5}
      - {cli: codex, model: gpt-6-astra}
  art_director:
    name: Đạo diễn hình
    skills: [scripting-and-storyboarding, visual-style]
    steps: [visual_review]
    tier: medium
    models:  # nhìn ảnh tốt
      - {cli: agy, model: gemini-4-carbon-high}
      - {cli: claude, model: claude-sonnet-5-5}
      - {cli: codex, model: gpt-6.1-sol}
      - {cli: codex, model: gpt-6.1-terra}
  editor:
    name: Thợ dựng
    skills: [remotion-best-practices, motion-design]
    steps: [revise_production, revise_product]
    tier: medium
    models:  # quen repo video
      - {cli: agy, model: gemini-4-argon-medium}
      - {cli: claude, model: claude-sonnet-5-5}
      - {cli: codex, model: gpt-6.1-sol}
      - {cli: codex, model: gpt-6.1-terra}
  product_critic:
    name: Kiểm định sản phẩm
    skills: [video-understand, character-animation-qa]
    steps: [product_review]
    tier: hard
  copywriter:
    name: Viết bài đăng
    skills: [social]
    steps: [posts]
    tier: bulk
  feedback_analyst:
    name: Phân tích ý kiến
    steps: [feedback_inbox]
    tier: medium
