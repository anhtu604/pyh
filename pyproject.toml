[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "healthvideo"
version = "0.1.0"
description = "CLI điều phối video y tế dự phòng"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.13.5",
    "typer==0.27.2",
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = [
    "jsonschema==4.26.0",
    "pytest==9.1.1",
    "ruff==0.16.6",
]

[project.scripts]
healthvideo = "healthvideo.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
